name: Publish PyPI package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          path: lingya-agents-sdk-python
      - uses: actions/checkout@v5
        with:
          repository: lingya-ai/lingya-agents-openapi
          ref: v1.0.0
          path: lingya-agents-openapi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify release tag
        run: test "${GITHUB_REF_NAME#v}" = "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
        working-directory: lingya-agents-sdk-python
      - run: pip install -r requirements-ci.txt -i https://pypi.tuna.tsinghua.edu.cn/simple && pip install -e . --no-deps
        working-directory: lingya-agents-sdk-python
      - run: python scripts/generate_bound_api.py && ruff check . && mypy && python scripts/audit_models.py && pytest -m "not live"
        working-directory: lingya-agents-sdk-python
      - run: python -m build --no-isolation
        working-directory: lingya-agents-sdk-python
      - name: Publish through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: lingya-agents-sdk-python/dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        working-directory: lingya-agents-sdk-python
